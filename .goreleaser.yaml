version: 2
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
nfpms:
  - maintainer: shenri1 <105889529+shenri1@users.noreply.github.com>
    description: TUI for package managers
    homepage: https://github.com/shenri1/lazymanager
    license: MIT
    section: utils
    formats: [deb, rpm, apk]
changelog:
  use: github
  filters:
    exclude:
      - "^Merge "
      - "^chore\\(deps\\)"
      - "^test:"
      - "^docs:"
      - "hotfix:"
